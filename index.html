<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scubidu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
    <div class="by">scubidu</div>

  <div class="radio" id="radio">
    <div class="top">
      <div class="eq" id="eq"></div>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="main">
      <div class="screen">
        <div class="card" id="card">
          <div class="noise"></div>
                    <div class="pic c" id="pic"></div>
          <div class="c">
            <div class="sub" id="sub"></div>
            <h1 id="h"></h1>
            <p class="t" id="t"></p>
            <span class="tag" id="tag"></span>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="pw"><div class="led on-led" id="led" title="Ligar/desligar"></div>POWER</div>
        <div class="cass" id="cass"><div class="win"><div class="reel"></div><div class="reel"></div></div></div>
        <div class="spk"></div>
      </div>
    </div>

    <div class="foot"><span id="freq">FM 67.0</span><span class="dot"></span></div>
  </div>

  <div class="hint"> © 2026 SCUBIDULL. TODOS OS DIREITOS RESERVADOS.</div>
</div>
<script src="script.js"></script>
</body>
</html>
